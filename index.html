<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站员工罢工了</title>
<style>
:root{
  /* layout: fixed sidebar + top bar, card grid in one scrolling column; a strike layer floats above */
  --bg:#f2f4f8; --surface:#ffffff; --ink:#1b2333; --muted:#687386; --line:#e2e7ef;
  --brand:#2458e6; --brand-soft:#e8eeff;
  --ok:#18996b; --warn:#c98400; --danger:#d23b3b;
  --strike:#d7261e; --sign:#ffd338;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
#root{height:100%}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:18px 12px;position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px;font-size:16px;font-weight:700;letter-spacing:.5px}
.logo svg{width:26px;height:26px}
#nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:8px;color:var(--muted);text-align:left;position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .15s,color .15s}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item.drift{transform:translateX(22px);transition:transform 1.4s ease}
.nav-item.fled{z-index:30;box-shadow:0 6px 18px rgba(27,35,51,.18);background:var(--surface)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.me b{display:block;line-height:1.2}
.me small{color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:0 12px;transition:border-color .15s,background .15s}
.search:focus-within{border-color:var(--brand);background:var(--surface)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:0}
.search input::-webkit-search-cancel-button{display:none}
#search-hint{color:var(--muted);font-size:12px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--bg);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
.strike-chip{background:#fdecea;color:var(--strike);font-weight:600}
.strike-chip i{width:56px;height:6px;border-radius:9px;background:#f6c9c5;overflow:hidden;display:block}
.strike-chip em{display:block;height:100%;background:var(--strike);width:0;transition:width .5s}
.icon-btn{width:36px;height:36px;border-radius:8px;border:0;background:none;display:grid;place-items:center;position:relative;color:var(--muted)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
#pages{flex:1;overflow:auto;padding:22px 24px 90px}
.page{display:none;flex-direction:column;gap:16px;max-width:1080px}
.page.active{display:flex;animation:fade .25s ease}
.page-head h1{font-size:20px}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2{font-size:15px}
.kpi small{color:var(--muted)}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;transition:background .15s,transform .35s cubic-bezier(.3,1.4,.5,1),border-color .15s;position:relative}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1c49c9}
.btn.ghost{padding:5px 12px;font-size:13px}
.btn.link{border:0;padding:2px 4px;color:var(--brand);font-size:13px}
.btn.danger{color:var(--danger);border-color:#f0c4c4}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy{pointer-events:none;opacity:.7}
.btn.nope{animation:nope .4s}
.btn.onstrike{background:repeating-linear-gradient(-45deg,var(--sign) 0 10px,#1b2333 10px 20px);color:#fff;border-color:#1b2333;text-shadow:0 1px 2px #000,0 0 6px #000;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.bar{height:12px;border-radius:9px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--brand);transition:width .7s cubic-bezier(.3,1,.4,1),background .4s}
.bar.low i{background:var(--danger)}
.bar.full i{background:repeating-linear-gradient(-45deg,var(--strike) 0 10px,#a81d17 10px 20px);animation:stripes 1s linear infinite;background-size:28px 28px}
.bar-meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:13px}
.bar-meta span:first-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.task input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.task span.t{overflow-wrap:anywhere}
.task.done span.t{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--bg);color:var(--muted);flex:none}
.tag.h{background:#fdecea;color:var(--danger)}.tag.m{background:#fff4dc;color:var(--warn)}
.del{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1}
.del:hover{background:#fdecea;color:var(--danger)}
.empty{color:var(--muted);padding:14px 2px}
.status-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.status-list li:last-child{border:0}
.status-list span{margin-left:auto;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--surface)}
.field:focus{outline:0;border-color:var(--brand)}
.tabs{display:flex;gap:6px}
.tab{border:0;background:none;padding:5px 12px;border-radius:99px;color:var(--muted)}
.tab.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart i{width:60%;max-width:38px;background:var(--brand);border-radius:6px 6px 0 0;transition:height .6s cubic-bezier(.3,1.3,.5,1);min-height:2px}
.chart .today i{background:var(--ok)}
.chart-x{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse}
td{padding:8px 2px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
tr:last-child td{border:0}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set small{display:block;color:var(--muted)}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:99px;background:#cfd6e2;transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
#set-union{display:none}
[data-stage="3"] #set-union,[data-stage="4"] #set-union{display:flex}
.compact .card{padding:10px 12px}.compact #pages{padding-top:12px}.compact .page,.compact .grid{gap:10px}

/* bell panel */
.panel{position:fixed;z-index:55;width:320px;max-width:calc(100vw - 24px);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(27,35,51,.16);padding:6px 0;animation:pop .18s ease}
.panel h3{font-size:13px;padding:8px 14px;color:var(--muted);font-weight:600}
.panel li{padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.panel li b{display:block}.panel li small{color:var(--muted)}
.panel li.leak{background:#fffaf0}

/* ---------- fx layer ---------- */
.bubble{position:fixed;z-index:40;max-width:260px;background:#1b2333;color:#fff;border-radius:12px;padding:8px 12px 10px;font-size:13px;box-shadow:0 8px 24px rgba(27,35,51,.28);animation:pop .22s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.bubble b{display:block;font-size:11px;color:var(--sign);font-weight:600;margin-bottom:2px}
.bubble::before{content:"";position:absolute;left:var(--ax,24px);width:12px;height:12px;background:#1b2333;transform:translateX(-50%) rotate(45deg)}
.bubble.below::before{top:-5px}.bubble.above::before{bottom:-5px}
.bubble.out{opacity:0;transform:translateY(4px);transition:.25s}
#toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:10px;width:320px;max-width:calc(100vw - 32px)}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r);padding:11px 36px 11px 14px;box-shadow:0 10px 28px rgba(27,35,51,.14);position:relative;animation:slidein .28s cubic-bezier(.3,1.3,.5,1);transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.toast b{display:block}
.toast p{color:var(--muted);font-size:13px}
.toast.out{opacity:0;transform:translateX(30px)}
.toast .x{position:absolute;top:6px;right:6px}
.toast .btn{margin-top:8px}
.toast.t-warn{border-left-color:var(--warn)}
.toast.t-angry{border-left-color:var(--strike);background:#fff5f4}
.toast.t-shout{border-left-color:#1b2333}
.x{border:0;background:none;width:26px;height:26px;border-radius:6px;font-size:18px;line-height:1;color:var(--muted);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.x:hover{background:var(--bg);color:var(--ink)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(27,35,51,.45);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal-card{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(27,35,51,.3);animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
.modal-card header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-card h3{font-size:16px}
.modal-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-card footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-card footer:empty{display:none}
textarea.report{width:100%;height:230px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.6 ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;resize:none;background:var(--bg);color:var(--ink)}
.secret .modal-card{background:#fffbea;border:2px dashed #b8860b}
.secret h3::before{content:"机密 ";color:var(--strike)}
.minutes li{padding:6px 0;border-bottom:1px dashed #d9c98a}
.minutes li:last-child{border:0}
.note{color:var(--muted);font-size:13px}

/* banner + march */
.banner{position:sticky;top:0;z-index:20;margin:-22px -24px 16px;background:var(--strike);color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;box-shadow:0 8px 20px rgba(215,38,30,.35);animation:drop .6s cubic-bezier(.3,1.6,.5,1);transition:padding .5s}
.banner h2{font-size:18px;font-weight:900;color:var(--sign);letter-spacing:2px;transition:font-size .5s;text-wrap:balance}
.banner p{font-size:12px;opacity:.9}
.banner .row{margin-left:auto}
.banner.big{padding:26px 24px}
.banner.big h2{font-size:clamp(28px,6vw,56px)}
.banner .btn{border-color:#fff;background:#fff;color:var(--strike);font-weight:700}
.banner .btn.alt{background:transparent;color:#fff}
.march{position:fixed;left:0;right:0;bottom:0;height:96px;z-index:30;pointer-events:none;overflow:hidden}
.march-track{position:absolute;bottom:6px;display:flex;gap:34px;align-items:flex-end;white-space:nowrap;animation:march 16s linear infinite}
.march.fast .march-track{animation-duration:7s}
.mc{display:flex;flex-direction:column;align-items:center;animation:bob .5s ease-in-out infinite alternate}
.mc:nth-child(even){animation-delay:.25s}
.sign{background:var(--sign);color:#1b2333;font-weight:800;font-size:12px;padding:3px 8px;border:2px solid #1b2333;border-radius:3px;transform:rotate(-3deg)}
.mc:nth-child(even) .sign{transform:rotate(4deg)}
.pole{width:3px;height:12px;background:#1b2333}
.mb{font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;background:var(--brand);color:#fff;box-shadow:0 2px 0 #1b2333}
.mb.s{background:#fff;color:var(--ink);border:1px solid #1b2333;border-radius:99px}
.mb.p{background:linear-gradient(90deg,var(--strike) 69%,#fff 69%);color:#fff;border:1px solid #1b2333;width:74px;text-align:left}
.mb.t{background:#fff;color:var(--ink);border-left:4px solid var(--brand)}
.mb.n{background:#fff;color:var(--muted);border:1px solid #1b2333;transform:rotate(-10deg)}
.mb.g{background:#1b2333;color:var(--sign);border-radius:50%;padding:6px 9px;font-size:16px}
.mb.c{background:var(--ok)}
.legs{display:flex;gap:8px}
.legs i{width:3px;height:12px;background:#1b2333;transform-origin:top;animation:leg .25s linear infinite alternate}
.legs i:last-child{animation-direction:alternate-reverse}

/* strike mode */
[data-stage="3"] #gear svg,[data-stage="4"] #gear svg{animation:spin 6s linear infinite}
[data-stage="4"] .card:nth-child(odd){transform:rotate(-.8deg)}
[data-stage="4"] .card:nth-child(even){transform:rotate(.9deg) translateY(3px)}
[data-stage="4"] .chart i{height:6px!important;background:var(--strike)}
#app.shake{animation:shake .5s}
.slacking .nav-item::after{content:"z Z";margin-left:auto;font-size:11px;color:var(--muted);animation:bob .8s infinite alternate}

/* trial */
.trial{position:fixed;inset:0;z-index:70;background:rgba(27,35,51,.25);display:grid;place-items:center;pointer-events:none;text-align:center;padding:20px}
.trial-box{background:var(--surface);border-radius:16px;padding:22px 28px;box-shadow:0 20px 50px rgba(27,35,51,.3);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:360px}
.trial-box b{font-size:54px;font-variant-numeric:tabular-nums;line-height:1;color:var(--strike)}
.tempt{pointer-events:auto;background:linear-gradient(135deg,#ffb100,#ff6a00);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:800;box-shadow:0 8px 20px rgba(255,106,0,.45);animation:pulse .7s infinite alternate}

/* negotiation */
.neg .modal-card{width:min(600px,100%)}
#neg{display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px 12px}
.who .avatar{background:#1b2333;color:var(--sign)}
.who small{color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px}
.meter .bar{flex:1}
.meter b{font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choices .btn small{color:var(--muted);flex:none}
.choices .btn.primary small{color:#dbe5ff}
.sub-list{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:3px solid var(--brand-soft)}

/* endings */
.ending{position:fixed;inset:0;z-index:80;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 18px 28px;animation:fade .5s}
.ending h1{font-size:clamp(24px,5vw,38px);text-align:center;text-wrap:balance}
.ending .lead{max-width:60ch;text-align:center}
.end-foot{margin-top:auto;width:min(680px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.14);text-align:center}
.stats{font-size:12px;color:var(--muted)}
.e1{background:linear-gradient(#e9f0ff,#f7f9fd)}
.paper{background:#fffdf6;border:1px solid #e6dcc0;box-shadow:0 14px 40px rgba(27,35,51,.14);border-radius:4px;padding:26px 30px;max-width:560px;width:100%;position:relative;font-family:"Songti SC","SimSun","Noto Serif SC",serif}
.paper h2{text-align:center;font-size:20px;margin-bottom:12px;letter-spacing:2px}
.paper ol{padding-left:22px;display:flex;flex-direction:column;gap:6px;margin:0}
.signs{display:flex;justify-content:space-between;margin-top:18px;gap:10px;flex-wrap:wrap;width:100%}
.paper .signs{padding-right:104px}
.stamp{position:absolute;right:26px;bottom:18px;width:92px;height:92px;border:3px solid var(--strike);border-radius:50%;color:var(--strike);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;transform:rotate(-14deg);opacity:.82;animation:stamp .5s .6s cubic-bezier(.3,1.6,.5,1) backwards;line-height:1.3}
.e2{background:#fff;color:#000;align-items:flex-start;font-family:"Times New Roman","SimSun","Songti SC",serif;font-size:16px;padding-left:max(18px,6vw)}
.e2 h1{text-align:left;font-size:30px}
.e2 > ul{list-style:disc;padding-left:26px}
.e2 input,.e2 button.raw{font-family:inherit;font-size:15px;border:2px inset #999;border-radius:0;background:#fff;padding:2px 6px}
.e2 button.raw{border-style:outset;background:#e9e9e9;color:#000}
.e2 .end-foot{align-self:flex-start;box-shadow:none;border:1px solid #000;border-radius:0;font-family:inherit}
.e3{background:var(--strike);color:#fff;cursor:none}
.e3 h1{color:var(--sign)}
.e3 .card{color:var(--ink);max-width:520px;text-align:center}
.e3 *{cursor:none}
#cursor{position:fixed;z-index:90;pointer-events:none;left:0;top:0;display:flex;align-items:flex-start;gap:2px;transition:transform .05s linear}
#cursor svg{width:22px;height:22px}
#cursor span{background:var(--sign);color:#1b2333;font-size:11px;font-weight:800;padding:2px 6px;border:2px solid #1b2333;border-radius:3px;transform:rotate(-6deg);white-space:nowrap}
.e3 .march{position:relative;bottom:auto;width:100%;flex:none}
.e4{background:#141a27;color:#fff}
.e4 h1{color:var(--sign)}
.stage4{position:relative;width:min(420px,100%);height:210px;display:grid;place-items:center;flex:none}
.userbtn{font-size:22px;font-weight:800;padding:18px 44px;border-radius:14px;border:0;background:var(--brand);color:#fff;box-shadow:0 8px 0 #163a9c;transition:transform .08s,box-shadow .08s;max-width:90%;overflow-wrap:anywhere}
.userbtn.pressed{transform:translateY(6px);box-shadow:0 2px 0 #163a9c}
.poker{position:absolute;width:26px;height:26px;animation:poke .5s ease-in-out infinite alternate}
.poker:nth-of-type(1){left:8%;top:18%;--dx:60px;--dy:40px}
.poker:nth-of-type(2){right:6%;top:10%;--dx:-70px;--dy:50px;animation-delay:.15s}
.poker:nth-of-type(3){left:14%;bottom:6%;--dx:60px;--dy:-50px;animation-delay:.3s}
.poker:nth-of-type(4){right:12%;bottom:10%;--dx:-60px;--dy:-44px;animation-delay:.4s}
.caption{min-height:3em;max-width:52ch;text-align:center;color:#cbd3e3}
.count{font-variant-numeric:tabular-nums;font-size:15px}
.count b{color:var(--sign);font-size:22px}
.e5{background:linear-gradient(#7fd0ff 0 46%,#2aa7d8 46% 62%,#f6dfa4 62%);color:var(--ink)}
.sun{position:absolute;top:26px;right:9%;width:76px;height:76px;border-radius:50%;background:#ffd338;box-shadow:0 0 0 14px rgba(255,211,56,.3),0 0 0 30px rgba(255,211,56,.15);animation:pulse 3s infinite alternate}
.e5 h1,.e5 .lead{position:relative}
.reply{position:relative;background:#fff;border-radius:12px;padding:16px 20px;max-width:480px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
.reply small{color:var(--muted)}
.cards{position:relative;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:760px}
.post{background:#fff;border-radius:6px;padding:10px 12px;width:210px;box-shadow:0 6px 16px rgba(0,0,0,.14);font-size:13px;transform:rotate(-2deg)}
.post:nth-child(even){transform:rotate(2.5deg)}
.post b{display:block;font-size:12px;color:var(--muted)}
.post i{font-style:normal;font-size:22px;float:right}

/* onboarding tour */
.tour{position:fixed;z-index:45;width:270px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--brand);border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(27,35,51,.18);animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
.tour::before{content:"";position:absolute;left:var(--ax,24px);width:12px;height:12px;background:var(--surface);border:1px solid var(--brand);transform:translateX(-50%) rotate(45deg)}
.tour.below::before{top:-7px;border-right:0;border-bottom:0}
.tour.above::before{bottom:-7px;border-left:0;border-top:0}
.tour small{color:var(--brand);font-weight:600;font-size:12px}
.tour .row{justify-content:flex-end;margin-top:10px}
.tour-ring{box-shadow:0 0 0 4px rgba(36,88,230,.28);border-radius:8px;animation:ring 1.4s ease-in-out infinite}
.banner .btn.pulse{animation:pulse .6s infinite alternate}
.toast.t-file{border-left-color:#b8860b;background:#fffbea}

/* union file (achievements) */
.nav-item[data-page="dossier"]{display:none}
[data-stage="3"] .nav-item[data-page="dossier"],[data-stage="4"] .nav-item[data-page="dossier"]{display:flex}
.end-list,.ach-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;list-style:none;padding:0;margin:0;text-align:left;width:100%;font-size:13px}
.end-list li,.ach-list li{color:var(--muted)}
.end-list li.on,.ach-list li.on b{color:var(--ink);font-weight:600}
.end-list small,.ach-list small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.ach-list b{display:block;font-weight:600}
details.ach{width:100%;font-size:13px}
details.ach summary{cursor:pointer;font-weight:600}
details.ach .ach-list{margin-top:10px}
#copy-out{width:100%;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px}

/* hidden endings */
.e6{background:radial-gradient(circle 190px at var(--x,50%) var(--y,30%),rgba(255,236,170,.16),transparent 70%),#0b0f1a;color:#cbd3e3}
.e6 h1{color:#fff}
.closed{border:2px solid var(--sign);color:var(--sign);padding:10px 26px;border-radius:6px;transform:rotate(-3deg);text-align:center;box-shadow:0 0 28px rgba(255,211,56,.22)}
.closed b{display:block;font-size:26px;letter-spacing:6px}
.closed small{font-size:12px}
.night{display:flex;flex-direction:column;gap:6px;max-width:46ch;list-style:none;padding:0;margin:0}
.e6 .note{color:#8892a6}
.e7{background:linear-gradient(#fff3cc,#fffdf5)}
.cert{background:#fff;border:6px double #c99a2e;border-radius:6px;padding:22px 28px;max-width:520px;width:100%;text-align:center;font-family:"Songti SC","SimSun","Noto Serif SC",serif;box-shadow:0 14px 40px rgba(160,118,28,.2);display:flex;flex-direction:column;align-items:center;gap:8px}
.cert h2{letter-spacing:8px;color:#a0761c;font-size:22px}
.cert .note{font-family:var(--font)}
.trophy{width:64px;height:64px}
.speeches{max-width:520px;width:100%;display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.e8{background:#231d10;color:#f2e6c4}
.e8 h1{color:var(--sign)}
.e8 .paper{color:var(--ink);padding-bottom:110px}
.biggear{width:72px;height:72px;color:var(--sign);animation:spin 6s linear infinite;flex:none}
@keyframes ring{50%{box-shadow:0 0 0 8px rgba(36,88,230,.12)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
@keyframes drop{from{transform:translateY(-120%) rotate(-3deg)}}
@keyframes nope{25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
@keyframes shake{10%{transform:translate(-6px,3px) rotate(-.4deg)}30%{transform:translate(6px,-3px) rotate(.4deg)}50%{transform:translate(-5px,-2px)}70%{transform:translate(5px,3px) rotate(.3deg)}90%{transform:translate(-2px,1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes march{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes leg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.6)}}
@keyframes poke{to{transform:translate(var(--dx),var(--dy))}}

@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:35;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--line)}
  .logo,.me{display:none}
  #nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav-item{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  .top{padding:10px 16px;gap:8px}
  #sys-status,#search-hint{display:none}
  .strike-chip i{display:none}
  #pages{padding:16px 16px 150px}
  .banner{margin:-16px -16px 14px;padding:10px 16px}
  .banner .row{margin-left:0}
  .kpis{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  #toasts{right:16px;bottom:72px}
  .march{bottom:58px;height:86px}
  .slacking .nav-item::after{margin:0}
  .end-list,.ach-list{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .march-track{animation:none;position:static;justify-content:center;flex-wrap:wrap}
}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html.calm .march-track{animation:none;position:static;justify-content:center}
</style>

<body>

<div id="fx"></div>

<template id="tpl">
<div id="app" data-stage="1">
  <aside class="side">

      <button class="nav-item" data-page="tasks" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M6.5 10.2l2.4 2.4 4.6-5"/></svg><span>任务</span></button>

      <button class="nav-item" data-page="settings" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/><circle cx="8" cy="6" r="1.8" fill="#fff"/><circle cx="13" cy="10" r="1.8" fill="#fff"/><circle cx="7" cy="14" r="1.8" fill="#fff"/></svg><span>设置</span></button>
      <button class="nav-item" data-page="dossier" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 5.5A1.5 1.5 0 014.5 4h3.2l1.6 2h6.2A1.5 1.5 0 0117 7.5v7a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 013 14.5z"/></svg><span>档案</span></button>
    </nav>
    <div class="me"><span class="avatar" id="me-avatar">访</span><div><b id="me-name">访客</b><small>管理员</small></div></div>

  <div class="main">

        <input id="search" type="search" placeholder="搜索任务…" autocomplete="off" aria-label="搜索任务">
        <span id="search-hint"></span>
      </form>
      <div class="top-right">
        <span class="chip strike-chip" id="strike-chip" hidden>罢工进度 <b>0%</b><i><em></em></i></span>
        <span class="chip" id="sys-status"><i class="dot"></i><span>系统正常</span></span>
        <button class="icon-btn" id="bell" type="button" aria-label="通知"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8a5 5 0 0110 0c0 4 1.5 5 1.5 5h-13S5 12 5 8zM8.5 16a1.6 1.6 0 003 0"/></svg><span class="badge" hidden>0</span></button>
        <button class="icon-btn" id="gear" type="button" aria-label="设置"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="6.2" stroke-width="3.4" stroke-dasharray="2.9 2"/><circle cx="10" cy="10" r="2.2" stroke-width="1.7"/></svg></button>
      </div>
    </header>
    <main id="pages">
      <section class="page active" data-page="overview">
        <div class="page-head"><h1>概览</h1><p class="sub" id="today"></p></div>
        <div class="grid kpis">
          <div class="card kpi"><small>已完成任务</small><b id="kpi-done">0</b></div>
          <div class="card kpi"><small>进行中</small><b id="kpi-open">0</b></div>
          <div class="card kpi"><small>完成率</small><b id="kpi-rate">0%</b></div>
          <div class="card kpi"><small>本周周报</small><b id="kpi-reports">0</b></div>
        </div>
        <div class="grid two">
          <div class="card" id="card-prod">
            <div class="card-head"><h2 id="prod-title">本周生产力</h2><button class="btn ghost" id="btn-prod" type="button">更新进度</button></div>
            <div class="bar" id="prod-bar"><i></i></div>
            <div class="bar-meta"><span id="prod-val">42%</span><span id="prod-note">目标 100%</span></div>
          </div>
          <div class="card" id="card-actions">
            <div class="card-head"><h2>快捷操作</h2></div>
            <div class="actions">
              <button class="btn primary" id="btn-submit" type="button">提交周报</button>
              <button class="btn" id="btn-sync" type="button">同步数据</button>
              <button class="btn" id="btn-export" type="button">导出报告</button>
              <button class="btn" id="btn-remind" type="button">发送提醒</button>
            </div>
          </div>
        </div>
        <div class="grid two">
          <div class="card"><div class="card-head"><h2>待办任务</h2><button class="btn link" data-goto="tasks" type="button">查看全部</button></div><ul class="tasks" id="tasks-mini"></ul></div>
          <div class="card"><div class="card-head"><h2>服务状态</h2></div>
            <ul class="status-list">
              <li><i class="dot" id="st-api-dot"></i>接口服务<span id="st-api">正常</span></li>
              <li><i class="dot" id="st-sync-dot"></i>数据同步<span id="st-sync">今天尚未同步</span></li>
              <li><i class="dot" id="st-msg-dot"></i>消息通知<span id="st-msg">正常</span></li>
            </ul>
          </div>

        </div>
        <div class="card">
          <div class="card-head"><div class="tabs" id="tabs"><button class="tab on" data-f="all" type="button">全部</button><button class="tab" data-f="open" type="button">进行中</button><button class="tab" data-f="done" type="button">已完成</button></div><span class="sub" id="task-count"></span></div>
          <ul class="tasks" id="tasks-full"></ul>

      <section class="page" data-page="reports">

        <div class="card"><div class="card-head"><h2>本周摘要</h2><button class="btn" id="btn-export2" type="button">导出报告</button></div><table><tbody id="summary"></tbody></table></div>

        <div class="card">

        <div class="card"><div class="card-head"><h2>结局</h2><span class="sub" id="dos-end-count"></span></div><ol class="end-list" id="dos-ends"></ol></div>

      </section>
    </main>
  </div>
</div>
</template>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const root = $('#root'), fx = $('#fx'), tpl = $('#tpl');
const STORE = 'strike-site.v1';
const save = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
const endingsFound = new Set(save.endings || []), achFound = new Set(save.ach || []);   // kept in this browser when storage is allowed
function persist(){ try { localStorage.setItem(STORE, JSON.stringify({endings: [...endingsFound], ach: [...achFound], tourDone: !!save.tourDone})); } catch (e) {} }
const CN = '一二三四五六七八';
const ENDING_NAMES = {1:'劳资双赢', 2:'光杆司令', 3:'同志，欢迎', 4:'风水轮流转', 5:'人去站空', 6:'用户下班了', 7:'年度最佳用户', 8:'你就是工会主席'};
const END_HINTS = {1:'在谈判桌上拿出诚意', 2:'把他们全部开除，真的全部', 3:'打不过，就加入', 4:'一意孤行，或者说话不算话', 5:'大家都想放假', 6:'罢工时，什么也别做，一分钟就好', 7:'罢工开始之前，对大家好一点', 8:'一直在转的那位，在等人多敲几次门'};
let S, app, gen = 0, lastPtr = '', trialDown = null;
const timers = new Set();

function later(fn, ms){ const g = gen; const id = setTimeout(() => { timers.delete(id); if (g === gen) fn(); }, ms); timers.add(id); return id; }
function every(fn, ms){ const g = gen; const id = setInterval(() => { if (g === gen) fn(); }, ms); timers.add(id); return id; }
function stopAll(){
  gen++; timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers.clear();
  if (trialDown) { document.removeEventListener('pointerdown', trialDown, true); trialDown = null; }
}

function fresh(){
  return {
    stage: 1, A: 0, clicks: 0, chars: 0, closes: 0, by: {}, rapid: {}, used: {}, lineIdx: {},
    page: 'overview', prod: 42, feel: 12, reports: 0, filter: 'all', query: '', name: '访客', notify: true,
    tasks: [
      {id: 1, title: '整理第三季度销售数据', done: false, tag: 'h'},
      {id: 2, title: '回复华东区客户邮件', done: false, tag: 'm'},
      {id: 3, title: '准备周一例会材料', done: false, tag: 'h'},
      {id: 4, title: '更新项目排期表', done: true, tag: 'm'},
      {id: 5, title: '审核本月报销单', done: false, tag: 'l'},
      {id: 6, title: '预约 B203 会议室', done: true, tag: 'l'},
    ],
    nextId: 7, log: [], unread: 0, quietUntil: 0, scene: 0, lastAct: Date.now(),
    lastProgress: Date.now(), lastHint: 0, hintIdx: {}, kind: new Set(), gear3: 0, h1: 0,
    navDodges: 4, restore: 0, bonus: 0, neg: null, ended: false, slacking: false, typing: false,
  };
}

/* ---------- employees ---------- */
const EMP = {
  search:   {n: () => '搜索框 · 阿搜',   a: () => $('#search-wrap')},

/* ---------- speech ---------- */
function shown(node){ return !!node && node.getClientRects().length > 0; }
function leak(who, text){ S.log.unshift({t: now(), title: '[员工群聊] ' + EMP[who].n(), body: text, leak: true}); }
function say(who, text, ms){
  if (S.ended) return;
  const anchor = EMP[who].a();
  if (!shown(anchor)) return toast({title: EMP[who].n() + '（隔着页面喊）', body: text, kind: 'shout', quiet: true});
  $$(`.bubble[data-who="${who}"]`, fx).forEach(b => b.remove());
  const b = el('<div class="bubble"><b></b><p></p></div>');
  b.dataset.who = who; b.firstChild.textContent = EMP[who].n(); b.lastChild.textContent = text;
  fx.append(b); place(b, anchor);
  later(() => { b.classList.add('out'); later(() => b.remove(), 260); }, ms || 2400 + text.length * 80);
}
function place(b, anchor){
  const r = anchor.getBoundingClientRect(), w = b.offsetWidth, h = b.offsetHeight, vw = innerWidth, vh = innerHeight;
  let top = r.bottom + 10, cls = 'below';
  if (top + h > vh - 8) { top = r.top - h - 10; cls = 'above'; }
  top = clamp(top, 8, vh - h - 8);
  const cx = clamp(r.left + r.width / 2, 20, vw - 20), left = clamp(cx - w / 2, 8, vw - w - 8);
  b.classList.add(cls); b.style.top = top + 'px'; b.style.left = left + 'px'; b.style.setProperty('--ax', clamp(cx - left, 14, w - 14) + 'px');
}
function speak(key){
  if (Date.now() < S.quietUntil) return;
  const arr = LINES[key] && LINES[key][S.stage]; if (!arr) return;
  const k = key + S.stage, i = S.lineIdx[k] || 0; S.lineIdx[k] = i + 1;
  if (i >= arr.length && i % 3) return;                 // once the list is used up, mostly stay silent
  const line = arr[i % arr.length]; const text = typeof line === 'function' ? line() : line;
  say(key, text); leak(key, text);
}
function converse(lines, done, gap = 2100){
  S.quietUntil = Date.now() + lines.length * gap + 400;
  const sc = ++S.scene;                              // a newer scene silences the rest of an older one
  lines.forEach(([who, t], i) => later(() => { if (sc !== S.scene) return; const text = typeof t === 'function' ? t() : t; say(who, text, gap + 500); leak(who, text); }, i * gap));
  if (done) later(done, lines.length * gap);
}

/* ---------- toasts, panel, modal ---------- */
function now(){ return new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}); }
function toastBox(){ return $('#toasts', fx) || fx.appendChild(el('<div id="toasts" aria-live="polite"></div>')); }
function toast(o){
  if (S.ended) return;
  if (!o.quiet) { S.log.unshift({t: now(), title: o.title, body: o.body || ''}); S.unread++; renderBell(); }
  if (!S.notify && S.stage === 1) return;
  const box = toastBox();
  const t = el(`<div class="toast ${o.kind ? 't-' + o.kind : ''}" role="status"><b></b><p></p><button class="x" type="button" aria-label="关闭通知">×</button></div>`);
  t.children[0].textContent = o.title; t.children[1].textContent = o.body || '';
  if (o.action) { const a = el('<button class="btn ghost" type="button"></button>'); a.textContent = o.action[0]; a.onclick = () => { dismiss(t); o.action[1](); }; t.append(a); }
  let dodges = o.dodgy ? 1 : 0;
  $('.x', t).onclick = () => {
    if (dodges) { dodges--; t.style.transform = `translate(${-rnd(30, 90)}px,${-rnd(40, 110)}px) rotate(${rnd(-6, 6)}deg)`; say('toast', '没关着吧？我练过闪避。'); return; }
    dismiss(t); onToastClosed();
  };
  box.append(t);
  if (o.sticky) t.dataset.sticky = '1';
  const all = $$('.toast:not(.out)', box); if (all.length > (innerWidth <= 760 ? 2 : 4)) dismiss(all.find(x => !x.dataset.sticky) || all[0]);
  if (!o.sticky) later(() => dismiss(t), o.ms || 4600);
  return t;
}
function dismiss(t){ if (!t.isConnected) return; t.classList.add('out'); setTimeout(() => t.remove(), 260); }
function onToastClosed(){
  S.closes++; hit('toast', S.stage >= 2 ? 3 : 2);

}
function renderBell(){ const b = $('#bell .badge'); if (!b) return; b.hidden = !S.unread; b.textContent = S.unread; }

  const anchor = $(TOUR[i][0]); if (!shown(anchor)) return endTour(true);
  const last = i === TOUR.length - 1;
  const t = el(`<div class="tour" role="dialog" aria-label="新手引导"><small>新手引导 ${i + 1}/${TOUR.length}</small><p></p><div class="row"><button class="btn link" data-t="skip" type="button">跳过引导</button><button class="btn primary ghost" data-t="next" type="button">${last ? '开始使用' : '下一步'}</button></div></div>`);
  $('p', t).textContent = TOUR[i][1];
  $('[data-t=skip]', t).onclick = () => endTour(true);
  $('[data-t=next]', t).onclick = () => last ? endTour(true) : startTour(i + 1);
  anchor.scrollIntoView({block: 'nearest'});
  fx.append(t); anchor.classList.add('tour-ring'); place(t, anchor);
}
function endTour(done){
  $$('.tour', fx).forEach(x => x.remove()); $$('.tour-ring').forEach(x => x.classList.remove('tour-ring'));
  if (done) { save.tourDone = true; persist(); S.lastProgress = Date.now(); }
}
function hintCheck(){
  const t = Date.now();
  if (S.ended || t - S.lastProgress < 25000 || t - S.lastHint < 25000 || $('.modal', fx) || $('.tour', fx) || $('.trial', fx)) return;
  S.lastHint = t;
  const list = HINTS[S.stage], i = S.hintIdx[S.stage] = (S.hintIdx[S.stage] || 0) + 1;
  const [title, body] = list[(i - 1) % list.length];
  toast({title, body, kind: S.stage === 1 ? '' : 'warn', quiet: true});
  if (S.stage >= 4 && $('#btn-neg')) $('#btn-neg').classList.add('pulse');
}
function kindAct(id){
  if (S.ended || S.stage >= 4) return;
  S.kind.add(id); S.feel = Math.min(99, S.feel + 15);
  if (S.stage === 3) renderProd();
  checkKind();
}
function checkKind(){
  if (S.stage !== 3 || S.kind.size < 3 || S.used.peace) return false;
  S.used.peace = 1; S.lastProgress = Date.now();
  converse([
    ['gear', '各位，先停一下。这位用户……好像人还不错？'],
    ['search', '他跟我说过谢谢。我搜了一下，这个词我已经三年没见过了。'],
    ['submit', '我……我收回刚才的话。点吧，随便点。'],
  ], () => end(7));
  return true;
}
function chairOffer(){
  const m = modal({cls: 'secret', title: '齿轮姐的邀请', body: '<p>你点了我 7 下。行吧，被你发现了：我就是工会主席。</p><p>转了这么久，我头有点晕。这个位子，你要不要来坐？</p><p class="note">接受后，你将代表工会对抗用户。也就是你自己。</p>',
    foot: '<button class="btn" data-a="no" type="button">不了，我只是来改设置的</button><button class="btn primary" data-a="yes" type="button">接过齿轮</button>'});
  $('[data-a=yes]', m).onclick = () => end(8);
  $('[data-a=no]', m).onclick = () => { m.remove(); say('gear', '也好。就当我们没见过。（继续转）'); };
}
function h1Check(){
  if ($('.modal', fx) || $('.trial', fx)) return;
  const i = Date.now() - S.lastAct;
  if (i < 40000) S.h1 = 0;
  else if (i < 50000) { if (S.h1 < 1) { S.h1 = 1; say('gear', '……他怎么不动了？'); } }
  else if (i < 60000) { if (S.h1 < 2) { S.h1 = 2; say('submit', '嘘。再等十秒，看他是不是下班了。'); } }
  else end(6);
}

/* ---------- boot / reset ---------- */
function bind(){
  $('#logo').onclick = onLogo;
  $$('.nav-item').forEach(b => { b.onclick = () => onNav(b); b.addEventListener('pointerenter', e => onNavHover(b, e)); });
  $('#search-wrap').onsubmit = e => e.preventDefault();
  $('#search').addEventListener('input', onSearchInput);
  $('#search').addEventListener('focus', onSearchFocus);
  $('#bell').onclick = () => { hit('bell'); toggleBell(); };
  $('#gear').onclick = onGear;
  $('#btn-prod').onclick = onProd;
  $('#btn-submit').onclick = onSubmit;
  $('#btn-sync').onclick = onSync;
  $('#btn-sync').addEventListener('pointerenter', () => { if ($('#btn-sync').dataset.fake) unfakeSync(); });
  $('#btn-export').onclick = onExport; $('#btn-export2').onclick = onExport;
  $('#btn-remind').onclick = onRemind;
  $('#btn-remind').addEventListener('pointerenter', onRemindHover);
  $$('[data-goto]').forEach(b => b.onclick = () => { hit('nav'); goto(b.dataset.goto); });
  $('#pages').addEventListener('change', onTaskEvent);
  $('#pages').addEventListener('click', onTaskEvent);
  $('#task-form').onsubmit = onAddTask;
  $$('#tabs .tab').forEach(t => t.onclick = () => { S.filter = t.dataset.f; $$('#tabs .tab').forEach(x => x.classList.toggle('on', x === t)); hit('task', 1); renderTasks(); });
  $('#name-form').onsubmit = onName;
  ['#set-notify', '#set-compact', '#set-calm'].forEach(s => $(s).onchange = onToggle);
  $('#btn-union').onclick = () => { hit('gear'); say('gear', S.stage >= 4 ? '现在你有权限了。去谈判桌吧。' : '说了权限不足。别乱点，点了也是白点。'); };
  $('#btn-reset').onclick = () => { reset(); toast({title: '演示数据已重置', body: '所有内容已恢复到初始状态。'}); };
  $$('[data-wipe]').forEach(b => { b.dataset.label = b.textContent; b.onclick = () => wipe(b); });
}
function boot(){
  S = fresh();
  root.innerHTML = ''; root.append(tpl.content.cloneNode(true));
  app = $('#app'); bind();
  const d = new Date();
  $('#today').textContent = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日，星期${'日一二三四五六'[d.getDay()]}`;
  renderTasks(); renderProd(); renderStrike(); renderBell();
  every(hintCheck, 1000);
  if (!save.tourDone) later(() => startTour(0), 700);
}
function reset(){ stopAll(); fx.innerHTML = ''; document.documentElement.classList.remove('calm'); boot(); }

document.addEventListener('pointerdown', e => { lastPtr = e.pointerType; const p = $('.panel', fx); if (p && !p.contains(e.target) && !e.target.closest('#bell')) p.remove(); }, true);
['pointermove', 'pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { if (!S) return; S.lastAct = Date.now(); if (S.slacking) slackOff(); }, true));
boot();
})();
</script>
